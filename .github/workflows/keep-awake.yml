name: Keep awake

# Render's free plan puts the server to sleep after 15 minutes without visitors, and the next
# visitor waits about a minute. This pings it every 10 minutes between roughly 07:00 and 24:00
# Oslo time so it's awake during the day. It only runs once the NODELIT_URL repository
# variable is set (Settings > Secrets and variables > Actions > Variables), e.g.
# https://nodelit.onrender.com
#
# Free instance hours: awake 17 hours a day is about 530 of Render's 750 free hours a month.
# GitHub can run scheduled jobs a few minutes late, so the server may still nap now and then.

on:
  schedule:
    - cron: '*/10 5-22 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.NODELIT_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the server
        env:
          NODELIT_URL: ${{ vars.NODELIT_URL }}
        run: curl --fail --silent --show-error --max-time 120 --retry 2 "${NODELIT_URL%/}/healthz"
